<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sword of the Word</title>
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" href="assets/icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sword of the Word">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--ink:#161413;--muted:#5E5955;--red:#A4161A;--deep:#7D0F13;--gold:#B8892B;--line:#DDD6CE}
*{box-sizing:border-box;touch-action:manipulation}   /* manipulation = no double-tap zoom while tapping reps; pinch zoom still works */
html{-webkit-text-size-adjust:100%}
.btn,.circle,#tabs button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);background:#fff;min-height:100vh;-webkit-text-size-adjust:100%}
#bg{position:fixed;inset:0;overflow:hidden;z-index:0;background:#fff}
#bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.theme-a #bg img{animation:drift 40s ease-in-out infinite alternate}
.theme-b #bg img{object-position:top center}
@keyframes drift{from{transform:translate(-2%,-2%) scale(1.12)}to{transform:translate(2%,2%) scale(1.2)}}
@keyframes floaty{from{transform:translateY(0)}to{transform:translateY(-4px)}}
.still #bg img,.still .card{animation:none!important}
@media (prefers-reduced-motion:reduce){#bg img,.card{animation:none!important}}
#glitter{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:28px 16px calc(100vh - 70px)}
.theme-b .card.hero{background:none;border:none;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;padding:2px 6px 0;margin-bottom:12px}
.theme-b .hero h1{font-size:40px;text-shadow:0 0 14px rgba(255,255,255,.95),0 0 3px rgba(255,255,255,.9)}
.theme-b .hero .eyebrow,.theme-b .hero p{text-shadow:0 0 10px #fff,0 0 3px #fff}
.theme-b .hero .muted{color:#2c2826;font-weight:600;font-size:15px}
.theme-b .hero .btn.plain{background:#fff;border:none;box-shadow:0 6px 16px rgba(22,20,19,.16),0 1px 3px rgba(22,20,19,.12)}
.theme-b .btn{min-height:44px;font-size:15px}
.theme-b .btn.small{min-height:38px;padding:0 14px;font-size:13px}
.theme-b .card h2{font-weight:700}
.theme-b .card .muted{color:#3a3532;font-weight:500}
.theme-b .verse{font-weight:700}
.card{border-radius:22px;padding:16px 18px;margin-bottom:14px}
.theme-a .card{background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid rgba(226,178,74,.95);box-shadow:0 22px 44px rgba(48,2,6,.36),0 4px 10px rgba(48,2,6,.2),inset 0 1px 0 rgba(255,255,255,.9)}
.theme-b .card{background:rgba(255,255,255,.26);-webkit-backdrop-filter:blur(5px) saturate(1.2);backdrop-filter:blur(5px) saturate(1.2);border:1px solid rgba(255,255,255,.5);box-shadow:0 6px 18px rgba(22,20,19,.08);text-shadow:0 0 7px rgba(255,255,255,.75)}
.theme-b .card .btn,.theme-b .card input,.theme-b .card select{text-shadow:none}
.theme-b .card.bare{background:none;border:none;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;margin-bottom:24px;animation:none}
.theme-b .card.bare{padding:0 6px}
.theme-b .card.bare p,.theme-b .card.bare .eyebrow{text-shadow:0 0 10px #fff,0 0 3px #fff}
.card.float{animation:floaty 8s ease-in-out infinite alternate}
h1{margin:0;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:34px;line-height:1.1}
h2{margin:0 0 8px;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:24px;line-height:1.2}
p{margin:0 0 10px;line-height:1.45}
.hl{color:var(--red);font-weight:700}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.eyebrow.red{color:var(--red)}
.muted{color:var(--muted);font-size:14px}
.verse{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:24px;line-height:1.3;margin:8px 0 12px}
.ink{position:relative}
.ink .verse{color:transparent;-webkit-text-fill-color:transparent;-webkit-background-clip:text;background-clip:text;background-color:rgba(164,22,26,.35);background-image:radial-gradient(circle,rgba(212,160,44,1) 1.1px,transparent 1.9px),radial-gradient(circle,rgba(164,22,26,.95) 1px,transparent 1.8px),radial-gradient(circle,rgba(255,236,170,1) .9px,transparent 1.6px);background-size:9px 11px,13px 9px,17px 15px;filter:blur(5px);user-select:none;-webkit-user-select:none;animation:ink 3.2s linear infinite,inkglow 2.6s ease-in-out infinite alternate}
@keyframes ink{from{background-position:0 0,0 0,0 0}to{background-position:9px 11px,-13px 9px,17px -15px}}
@keyframes inkglow{from{opacity:.55}to{opacity:1}}
.still .ink .verse{animation:none}
@media (prefers-reduced-motion:reduce){.ink .verse{animation:none}}
.inkref{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;text-align:center;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:38px;line-height:1.05;letter-spacing:.3px;color:var(--ink);text-shadow:0 0 10px #fff,0 0 10px #fff,0 0 18px #fff,0 0 4px #fff}
.sheetbg{position:fixed;top:0;left:0;right:0;bottom:0;z-index:5;background:rgba(22,20,19,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{width:100%;max-width:448px;margin:0;background:#fff!important}
.wheels{display:flex;justify-content:center;gap:28px;margin:8px 0 16px}
.wcol{text-align:center}
.wheel{height:132px;width:104px;overflow-y:scroll;scroll-snap-type:y mandatory;border-radius:18px;border:1px solid var(--line);background:linear-gradient(#E9E2DA,#fff 34%,#fff 66%,#E9E2DA);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.wheel::-webkit-scrollbar{display:none}
.wi,.wpad{height:44px;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:30px}
.wi{scroll-snap-align:center}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.big{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:44px;line-height:1;color:var(--red)}
.bar{flex:1;height:8px;border-radius:4px;background:#E4DCD3;overflow:hidden}
.bar>i{display:block;height:8px;background:var(--red)}
button{font-family:inherit;cursor:pointer}
.btn{min-height:48px;padding:0 20px;border:none;border-radius:26px;background:var(--red);color:#fff;font-size:16px;font-weight:700}
.btn.wide{width:100%;min-height:54px}
.btn.dark{background:var(--ink)}
.btn.ghost{background:#fff;color:var(--red);border:1.5px solid var(--red)}
.btn.plain{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.btn.small{min-height:44px;padding:0 16px;font-size:14px}
.btn:disabled{opacity:.45}
.circle{width:48px;height:48px;border-radius:24px;border:1.5px solid var(--gold);background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.circle.on{background:var(--red);border-color:var(--red)}
.choice{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:56px;padding:0 18px;margin-bottom:10px;border:1px solid var(--line);border-radius:18px;background:#fff;color:var(--ink);font-size:17px;font-weight:600;text-align:left}
.choice.on{background:var(--red);border-color:var(--red);color:#fff}
.choice span{font-size:14px;font-weight:500;color:var(--muted)}
.choice.on span{color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.chip{min-width:46px;min-height:44px;padding:0 10px;border:1px solid var(--line);border-radius:22px;background:#fff;color:var(--ink);font-size:14px;font-weight:600}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;min-height:48px;padding:10px 12px;border:1px solid #B9B1A8;border-radius:14px;background:#fff;color:var(--ink);font-family:inherit;font-size:16px}
textarea{min-height:260px;line-height:1.4}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.steps{display:flex;gap:6px;margin:6px 0 14px}
.steps i{width:28px;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--red)}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #EEE8E1}
.item:first-child{border-top:none}
.x{width:44px;height:44px;border:none;background:none;color:var(--muted);font-size:22px;flex:none}
.cheerbg{position:fixed;top:0;left:0;right:0;bottom:0;z-index:6;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden}
.cheerbg::before,.cheerbg::after{content:"";position:absolute;left:50%;top:50%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;border-radius:50%;pointer-events:none;
 -webkit-mask-image:radial-gradient(circle,#000 0%,rgba(0,0,0,.75) 14%,rgba(0,0,0,.3) 30%,transparent 46%);mask-image:radial-gradient(circle,#000 0%,rgba(0,0,0,.75) 14%,rgba(0,0,0,.3) 30%,transparent 46%)}
.cheerbg::before{background:repeating-conic-gradient(from 0deg,rgba(255,236,170,0) 0deg,rgba(255,240,185,.85) 3deg,rgba(255,226,150,0) 8deg,rgba(255,226,150,0) 15deg);animation:rayspin 46s linear infinite}
.cheerbg::after{background:repeating-conic-gradient(from 6deg,rgba(255,250,225,0) 0deg,rgba(255,250,225,.7) 2deg,rgba(255,250,225,0) 6deg,rgba(255,250,225,0) 23deg);animation:rayspin 70s linear infinite reverse}
.cheer{position:relative;z-index:1;width:100%;max-width:330px;border-radius:28px;padding:26px 24px 24px;text-align:center;background:radial-gradient(circle at 50% 30%,#fff 0%,#FFFAEC 55%,#FCEBC2 100%);border:1.5px solid #E9C46A;
 box-shadow:inset 0 0 0 1px rgba(255,255,255,.7),0 0 34px 8px rgba(255,216,125,.8),0 0 110px 44px rgba(255,204,96,.45);animation:cheerpop .4s ease-out,cheerglow 3.2s ease-in-out .4s infinite alternate}
.cheer .star{font-size:30px;line-height:1;color:var(--gold);margin-bottom:6px;text-shadow:0 0 12px rgba(255,214,120,.9)}
.cheer h1{color:var(--red);font-size:36px}
.cheer p{margin:10px 0 0;font-size:16px}
@keyframes rayspin{to{transform:rotate(360deg)}}
@keyframes cheerglow{from{box-shadow:inset 0 0 0 1px rgba(255,255,255,.7),0 0 28px 6px rgba(255,216,125,.7),0 0 90px 34px rgba(255,204,96,.35)}to{box-shadow:inset 0 0 0 1px rgba(255,255,255,.7),0 0 44px 14px rgba(255,220,135,.95),0 0 140px 60px rgba(255,204,96,.6)}}
.still .cheerbg::before,.still .cheerbg::after,.still .cheer{animation:none}
@media (prefers-reduced-motion:reduce){.cheerbg::before,.cheerbg::after,.cheer{animation:none}}
@keyframes cheerpop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.msg{padding:10px 12px;border-radius:12px;background:#FBF3DC;color:#4A3A0C;font-size:14px;margin:10px 0}
#tabs{position:fixed;z-index:2;left:50%;transform:translateX(-50%);bottom:16px;width:calc(100% - 32px);max-width:448px;height:66px;border-radius:33px;display:flex;align-items:center;justify-content:space-around;padding:0 6px}
.theme-a #tabs{background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid rgba(226,178,74,.95);box-shadow:0 14px 30px rgba(48,2,6,.35)}
.theme-b #tabs{background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid #E7E0D8;box-shadow:0 14px 30px rgba(22,20,19,.18)}
#tabs[hidden]{display:none}
#tabs button{flex:1;min-width:0;height:52px;padding:0;border:none;background:none;color:var(--muted);font-size:11.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
#tabs button.on{color:var(--red);font-weight:700}
#tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px 0;margin-top:10px}
.cal .wd{text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:none;padding:0;color:var(--ink)}
.day b{width:42px;height:42px;border-radius:21px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;border:2px solid transparent}
.day.done b{border-color:var(--gold)}
.day.today b{background:var(--red);color:#fff}
.day.sel b{outline:2px solid var(--ink);outline-offset:2px}
.day i{width:6px;height:6px;border-radius:3px;background:transparent}
.day.new i{background:var(--red)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:12px;padding-top:12px;border-top:1px solid var(--gold)}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.themepick{border:2px solid var(--line);border-radius:18px;background:#fff;padding:0;overflow:hidden;color:var(--ink);font-size:15px;font-weight:700}
.themepick.on{border-color:var(--red)}
.themepick img{display:block;width:100%;height:150px;object-fit:cover;object-position:top}
.themepick div{padding:10px 8px}
</style>
</head>

// How many plan-days into the plan a real date is; null on a rest day or before the start.
function planDay(plan,n){
  var raw=n-isoToDn(plan.start);
  var sh=(plan.shifts||[]).slice().sort(function(a,b){return isoToDn(a.from)-isoToDn(b.from);});
  for(var i=0;i<sh.length;i++){var f=isoToDn(sh[i].from);
    if(n>=f+sh[i].days)raw-=sh[i].days; else if(n>=f)return null;}
  return raw<0?null:raw;
}
// Plan-day on which each verse is first learned.
function buildOffsets(pace,startDn,count){
  var out=[],i;

    for(var d=0;out.length<count&&d<count*7+14;d++){if(pace.days.indexOf(dnToDate(startDn+d).getUTCDay())>=0)out.push(d);}
    return out;
  }

// What a verse needs n plan-days after it was first learned.
function stage(n,realDn){
  if(n<0)return null;
  if(n<4)return {kind:'learn',reps:REPS[n],label:txf(n===0?'New verse · day {a} of 4':'Still learning · day {a} of 4',n+1)};
  if(n<49)return {kind:'daily',reps:1,label:txf('Daily review · day {a} of 45',n-3)};
  if(n<=97){return (n-48)%7===0?{kind:'weekly',reps:1,label:txf('Weekly review · week {a} of 7',(n-48)/7)}:null;}

function tasksFor(plans,done,n){

      var key=plan.id+'|'+vi+'|'+iso;

    });

var REF_RE=/^\(?\s*((?:[1-3]\s?)?[A-Za-zÁÉÍÓÚÜÑáéíóúüñ][A-Za-zÁÉÍÓÚÜÑáéíóúüñ. ]*?)\s+(\d{1,3})\s*[:.]\s*(\d{1,3})(?:\s*[-–—]\s*(\d{1,3}))?\s*\)?\s*(?:[-–—,]?\s*\(?([A-Za-z][A-Za-z0-9]{1,9})\)?)?\s*$/;

// Turns a pasted passage into separate, properly named verses.
// Works with verse numbers inside the text, or one verse per line; a reference line pasted with the text is used as the reference.
function parsePassage(ref,trans,text){
  var R=readRef(ref),keep=[];
  String(text||'').split(/\n+/).map(function(s){return s.trim();}).filter(Boolean).forEach(function(l){
    var r=l.length<60?readRef(l):null;
    if(r){if(!R)R=r;else if(!R.tr&&r.tr)R.tr=r.tr;}else keep.push(l);
  });
  if(!keep.length)return {err:'empty'};
  if(!R)return {err:'noref'};
  var tag=(trans||'').trim()||R.tr;tag=tag?' · '+tag:'';
  var k=R.b-R.a+1,parts=null,joined=keep.join(' ');
  function strip(s){return s.replace(/^[\[(]?\d{1,3}[\])]?[.:]?\s+/,'').trim();}
  if(k===1)parts=[strip(joined)];
  else{
    var cuts=[],pos=0,ok=true;
    for(var v=R.a+1;v<=R.b;v++){
      var re=new RegExp('(^|[\\s\\[(])'+v+'[\\])]?[.:]?\\s+(?=\\S)','g');re.lastIndex=pos;
      var m=re.exec(joined);if(!m){ok=false;break;}
      cuts.push(m.index+m[1].length);pos=re.lastIndex;
    }
    if(ok){parts=[];var prev=0;cuts.concat([joined.length]).forEach(function(c){parts.push(strip(joined.slice(prev,c)));prev=c;});}
    else if(keep.length===k)parts=keep.map(strip);

  }

  return {verses:parts.map(function(t,i){return {ref:R.book+' '+R.ch+':'+(R.a+i),t:t,tr:tag};})};
}
function planTitle(vs){
  if(!vs.length)return '';

  var a=vs[0].ref,b=vs[vs.length-1].ref,pa=a.slice(0,a.lastIndexOf(':')),pb=b.slice(0,b.lastIndexOf(':'));

  return txf('{a} and {b} more',a,vs.length-1);
}

// Grace mode: the first unfinished day in the run of missed days that ends yesterday (null if on track).
function graceStart(plan,done,today){
  var n0=null,start=isoToDn(plan.start);
  for(var n=today-1;n>=start;n--){
    var ts=tasksFor([plan],done,n);
    if(!ts.length)continue;
    if(ts.every(function(t){return t.count>=t.reps;}))break;
    n0=n;
  }
  return n0;
}
// Makes the missed days rest days, so today repeats the first unfinished day. Returns true if anything changed.
function applyGrace(plan,done,today){
  var n0=graceStart(plan,done,today);if(n0===null)return false;
  plan.shifts=(plan.shifts||[]).filter(function(s){var f=isoToDn(s.from);return f<n0||f>=today;});
  plan.shifts.push({from:dnToIso(n0),days:today-n0});
  return true;
}

function buildReminders(plans,done,times,name,lang,now,snz){

    var n=now.dn+d,ts=tasksFor(plans,done,n);if(!ts.length)continue;
    var date=dnToDate(n),p=String(times[date.getUTCDay()]||'07:00').split(':'),h=+p[0],mi=+p[1];
    if(isNaN(h)||isNaN(mi))continue;

    var pool=d>=3?M.back:M.day,m=pool[n%pool.length],base={y:date.getUTCFullYear(),mo:date.getUTCMonth()+1,d:date.getUTCDate()};
    var hold=d===0&&snz&&snz.dn===now.dn?snz.until:-1;

// ----- Groups: turning values into the shape Firestore's web address expects, and back -----
function enc(v){
  if(v===null||v===undefined)return {nullValue:null};
  if(typeof v==='string')return {stringValue:v};
  if(typeof v==='boolean')return {booleanValue:v};
  if(typeof v==='number')return Math.floor(v)===v?{integerValue:String(v)}:{doubleValue:v};
  if(Array.isArray(v))return {arrayValue:{values:v.map(enc)}};
  var f={};Object.keys(v).forEach(function(k){f[k]=enc(v[k]);});return {mapValue:{fields:f}};
}
function dec(v){
  if(!v)return null;
  if('stringValue' in v)return v.stringValue;
  if('integerValue' in v)return +v.integerValue;
  if('doubleValue' in v)return v.doubleValue;
  if('booleanValue' in v)return v.booleanValue;
  if('arrayValue' in v)return (v.arrayValue.values||[]).map(dec);
  if('mapValue' in v){var o={},f=v.mapValue.fields||{};Object.keys(f).forEach(function(k){o[k]=dec(f[k]);});return o;}
  return null;
}

function fbJson(r){return r.json().then(function(j){if(!r.ok){var e=new Error((j&&j.error&&j.error.message)||'error');e.status=r.status;throw e;}return j;});}
function fbAuth(){
  var a=S.fb,now=Date.now();
  if(a&&a.token&&a.exp>now+60000)return Promise.resolve(a);
  if(a&&a.refresh){
    return fetch('https://securetoken.googleapis.com/v1/token?key='+FB.key,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(a.refresh)})
      .then(fbJson).then(function(j){S.fb={uid:j.user_id,token:j.id_token,refresh:j.refresh_token,exp:now+(+j.expires_in)*1000};persist();return S.fb;});
  }
  return fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+FB.key,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({returnSecureToken:true})})
    .then(fbJson).then(function(j){S.fb={uid:j.localId,token:j.idToken,refresh:j.refreshToken,exp:now+(+j.expiresIn)*1000};persist();return S.fb;});
}
function fbCall(method,path,body){
  return fbAuth().then(function(a){
    return fetch(FS+path,{method:method,headers:{'Authorization':'Bearer '+a.token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined})
      .then(function(r){return method==='DELETE'&&r.ok?{}:fbJson(r);});
  });
}

// Flowing gold glitter for the "Flowing gold" background.
var GL={c:null,ctx:null,p:[],raf:0,w:0,h:0};
function glitterOn(){
  var calm=false;try{calm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
  return !S.still&&!calm;
}
function glitterSize(){
  var d=Math.min(window.devicePixelRatio||1,2);GL.w=window.innerWidth;GL.h=window.innerHeight;
  GL.c.width=GL.w*d;GL.c.height=GL.h*d;GL.ctx.setTransform(d,0,0,d,0,0);
}
function glitterNew(anywhere){
  return {x:Math.random()*GL.w*1.2-GL.w*0.2,y:anywhere?Math.random()*GL.h:-12,r:0.5+Math.random()*1.7,vx:0.06+Math.random()*0.22,vy:0.10+Math.random()*0.32,ph:Math.random()*6.28,sp:0.6+Math.random()*1.8,sway:Math.random()*6.28};
}
function glitterInit(){
  var c=document.getElementById('glitter');if(!c||!c.getContext)return;
  GL.c=c;GL.ctx=c.getContext('2d');glitterSize();
  window.addEventListener('resize',glitterSize);
  for(var i=0;i<150;i++)GL.p.push(glitterNew(true));
}
function glitterTick(t){
  var ctx=GL.ctx;ctx.clearRect(0,0,GL.w,GL.h);
  if(!glitterOn()){GL.raf=0;return;}
  var dk=true;   // one look only now (Sword and shield): plain deeper-gold specks
  for(var i=0;i<GL.p.length;i++){
    var p=GL.p[i];
    p.x+=p.vx+Math.sin(t/1500+p.sway)*0.22;p.y+=p.vy;
    if(p.y>GL.h+12||p.x>GL.w+12)GL.p[i]=p=glitterNew(false);
    var a=0.2+0.8*(0.5+0.5*Math.sin(t/1000*p.sp+p.ph));
    if(dk){a*=Math.max(0,Math.min(1,(p.y-GL.h*0.30)/(GL.h*0.12)));if(a<=0)continue;}   // Sword and shield: no dust up in the white title area, and no halo
    else{ctx.globalAlpha=a*0.2;ctx.fillStyle='#F0C75A';ctx.beginPath();ctx.arc(p.x,p.y,p.r*3.2,0,6.283);ctx.fill();}
    ctx.globalAlpha=a;ctx.fillStyle=dk?'#F2C94C':'#FFF1BF';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();
  }
  ctx.globalAlpha=1;
  GL.raf=window.requestAnimationFrame(glitterTick);
}
function glitterSync(){
  if(!GL.ctx)return;
  if(glitterOn()){if(!GL.raf)GL.raf=window.requestAnimationFrame(glitterTick);}
  else if(!GL.raf)GL.ctx.clearRect(0,0,GL.w,GL.h);
}

  wrm:function(d){UI.wiz.verses.splice(+d.i,1);},
  wpaste:function(){var W=UI.wiz,r=parsePassage(W.ref,W.tr,W.text);
    if(r.err){W.msg=r.err==='empty'?tx('Type or paste at least one verse first.'):r.err==='noref'?tx('Add the reference first, for example Romans 8:28-30, so each verse gets its proper name.'):txf('The reference covers {a} verses, but I could not tell where each one starts. Keep the verse numbers in the text, or put each verse on its own line.',r.n);return;}
    W.verses=W.verses.concat(r.verses);W.text='';W.ref='';W.msg=txf('Added {a}.',pv(r.verses.length));},
  wfetch:function(){
    var W=UI.wiz,bi=parseInt(W.book,10)||0,ch=parseInt(W.ch,10),a=parseInt(W.from,10),b=parseInt(W.to,10);
    if(!ch||!a){W.msg=tx('Enter a chapter and a starting verse.');return;}
    if(!b||b<a)b=a;
    var es=LANG==='es',code=es?'rv1909':'kjv',tag=es?' · RV1909':' · KJV',name=(es?BOOKS_ES:BOOKS)[bi];
    var shown=name+' '+ch+':'+a+(b>a?'-'+b:'');
    function clean(v){return {ref:name+' '+ch+':'+v.verse,t:String(v.text).replace(/\s+/g,' ').trim(),tr:tag};}
    W.busy=true;W.msg='';
    // First try the chapter address; if that fails, try the older reference address.
    getJson('https://bible-api.com/data/'+code+'/'+BOOK_IDS[bi]+'/'+ch).then(function(j){
      var vs=(j.verses||[]).filter(function(v){return +v.verse>=a&&+v.verse<=b;}).map(clean);
      if(!vs.length)throw new Error('x');return vs;
    }).catch(function(){
      return getJson('https://bible-api.com/'+encodeURIComponent(BOOKS[bi]+' '+ch+':'+a+(b>a?'-'+b:''))+'?translation='+code).then(function(j){
        var vs=(j.verses||[]).map(clean);if(!vs.length)throw new Error('x');return vs;});
    }).then(function(vs){
      if(!UI.wiz)return;
      W.verses=W.verses.concat(vs);W.busy=false;W.msg=txf('Added {a}.',pv(vs.length));render();
    }).catch(function(){if(!UI.wiz)return;W.busy=false;W.src='paste';W.ref=shown;W.tr=es?'RV1909':'KJV';W.msg=tx('The Bible text could not be reached from here. Paste the verses below instead.');render();});
  },
  wnext:function(){var W=UI.wiz;if(W.step===1&&!W.verses.length)return;if(W.step===2&&!/^\d{4}-\d\d-\d\d$/.test(W.start))W.start=dnToIso(todayDn());if(W.step===3&&W.pace.type==='weekdays'&&!W.days.length)W.days=[1,3,5];W.step+=(W.group&&W.step===3?2:1);W.msg='';window.scrollTo(0,0);},
  wback:function(){UI.wiz.step-=(UI.wiz.group&&UI.wiz.step===5?2:1);window.scrollTo(0,0);},
  wpace:function(d){UI.wiz.pace=+d.n?{type:'every',n:+d.n}:{type:'weekdays'};},
  wday:function(d){var a=UI.wiz.days,i=a.indexOf(+d.i);if(i>=0)a.splice(i,1);else a.push(+d.i);},
  wdone:function(){var W=UI.wiz,pace=wizPace();
    S.plans.push({id:'p'+Date.now().toString(36),title:planTitle(W.verses),verses:W.verses,start:W.start,pace:pace,offsets:buildOffsets(pace,isoToDn(W.start),W.verses.length),shifts:[]});
    save();UI.wiz=null;UI.tab=W.group?'group':'today';window.scrollTo(0,0);if(W.group)createGroup(W.group,S.plans[S.plans.length-1]);}
};
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el||el.disabled)return;
  syncWiz();syncGroup();var ni=document.getElementById('name_in');if(ni&&ni.value.trim()!==(S.name||'')){S.name=ni.value.trim().slice(0,30);}
  var a=el.dataset.a,f=ACT[a];if(a!=='grace'&&a!=='snoozego')UI.note=null;if(a.charAt(0)!=='g'||a==='grace')UI.gmsg=UI.tab==='group'&&a==='theme'?UI.gmsg:'';
  if(f){var was=allDoneToday(),k=el.dataset.k,r=+el.dataset.r,before=k?(S.done[k]||0):0;f(el.dataset);
    var verseDone=a==='tap'&&before<r&&(S.done[k]||0)>=r;
    var dayDone=!was&&allDoneToday();if(dayDone)showCheer();
    sfx(dayDone?'day':verseDone?'verse':'tap');
    render();}
});
// The snooze dials: read the value when a dial is rolled.
document.addEventListener('scroll',function(e){
  var el=e.target;if(!UI.snooze||!el||(el.id!=='wh_h'&&el.id!=='wh_m'))return;
  var i=Math.round(el.scrollTop/44),key=el.id==='wh_h'?'h':'m',v=key==='h'?Math.max(0,Math.min(12,i)):Math.max(0,Math.min(11,i))*5;
  if(UI.snooze[key]!==v){UI.snooze[key]=v;sfx('tick');var b=document.getElementById('snz_go');if(b)b.textContent=snoozeLabel();}
},true);
document.addEventListener('change',function(e){
  var el=e.target;if(el.dataset&&el.dataset.c==='rem'){S.reminders[+el.dataset.i]=el.value||'07:00';save();}
  if(el.dataset&&el.dataset.c==='name'){S.name=el.value.trim().slice(0,30);save();}
});
load();if(!S.groups)S.groups=[];glitterInit();render();nativeSync();queueReport();
if(isNative()){try{window.webkit.messageHandlers.treasured.postMessage({ready:true});}catch(e){}}
document.addEventListener('visibilitychange',function(){if(!document.hidden){render();nativeSync();queueReport();if(UI.tab==='group')refreshGroups();}});
</script>

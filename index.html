<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Treasured</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--ink:#161413;--muted:#5E5955;--red:#A4161A;--deep:#7D0F13;--gold:#B8892B;--line:#DDD6CE}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);background:#fff;min-height:100vh;-webkit-text-size-adjust:100%}
#bg{position:fixed;inset:0;overflow:hidden;z-index:0;background:#fff}
#bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.theme-a #bg img{animation:drift 40s ease-in-out infinite alternate}
.theme-b #bg img{object-position:top center;animation:driftb 40s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(-2%,-2%) scale(1.12)}to{transform:translate(2%,2%) scale(1.2)}}
@keyframes driftb{from{transform:scale(1)}to{transform:translate(-1.5%,1%) scale(1.05)}}
@keyframes floaty{from{transform:translateY(0)}to{transform:translateY(-4px)}}
.still #bg img,.still .card{animation:none!important}
@media (prefers-reduced-motion:reduce){#bg img,.card{animation:none!important}}
#ribbon{position:absolute;top:0;left:0;width:100%;height:100%;display:none}
#sheen{display:none;position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.6) 50%,transparent 58%);mix-blend-mode:soft-light;animation:sheen 9s ease-in-out infinite alternate}
.theme-b #sheen{display:block}
.still #sheen{display:none}
@keyframes sheen{from{transform:translateX(-35%)}to{transform:translateX(35%)}}
@media (prefers-reduced-motion:reduce){#sheen{display:none!important}}
#glitter{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:28px 16px 120px}
.theme-b main{padding-top:150px}
.card{border-radius:22px;padding:16px 18px;margin-bottom:14px}
.theme-a .card{background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid rgba(226,178,74,.95);box-shadow:0 22px 44px rgba(48,2,6,.36),0 4px 10px rgba(48,2,6,.2),inset 0 1px 0 rgba(255,255,255,.9)}
.theme-b .card{background:rgba(255,255,255,.97);border:1px solid #E7E0D8;box-shadow:0 20px 40px rgba(22,20,19,.16),0 3px 8px rgba(22,20,19,.1)}
.card.float{animation:floaty 8s ease-in-out infinite alternate}
h1{margin:0;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:34px;line-height:1.1}
h2{margin:0 0 8px;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:24px;line-height:1.2}
p{margin:0 0 10px;line-height:1.45}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.eyebrow.red{color:var(--red)}
.muted{color:var(--muted);font-size:14px}
.verse{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:24px;line-height:1.3;margin:8px 0 12px}
.verse.hidden{color:transparent;background:repeating-linear-gradient(0deg,#EFEAE4,#EFEAE4 22px,transparent 22px,transparent 31px);border-radius:8px;user-select:none}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.big{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:44px;line-height:1;color:var(--red)}
.bar{flex:1;height:8px;border-radius:4px;background:#E4DCD3;overflow:hidden}
.bar>i{display:block;height:8px;background:var(--red)}
button{font-family:inherit;cursor:pointer}
.btn{min-height:48px;padding:0 20px;border:none;border-radius:26px;background:var(--red);color:#fff;font-size:16px;font-weight:700}
.btn.wide{width:100%;min-height:54px}
.btn.dark{background:var(--ink)}
.btn.ghost{background:#fff;color:var(--red);border:1.5px solid var(--red)}
.btn.plain{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.btn.small{min-height:44px;padding:0 16px;font-size:14px}
.btn:disabled{opacity:.45}
.circle{width:48px;height:48px;border-radius:24px;border:1.5px solid var(--gold);background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.circle.on{background:var(--red);border-color:var(--red)}
.choice{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:56px;padding:0 18px;margin-bottom:10px;border:1px solid var(--line);border-radius:18px;background:#fff;color:var(--ink);font-size:17px;font-weight:600;text-align:left}
.choice.on{background:var(--red);border-color:var(--red);color:#fff}
.choice span{font-size:14px;font-weight:500;color:var(--muted)}
.choice.on span{color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.chip{min-width:46px;min-height:44px;padding:0 10px;border:1px solid var(--line);border-radius:22px;background:#fff;color:var(--ink);font-size:14px;font-weight:600}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;min-height:48px;padding:10px 12px;border:1px solid #B9B1A8;border-radius:14px;background:#fff;color:var(--ink);font-family:inherit;font-size:16px}
textarea{min-height:140px;line-height:1.4}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.steps{display:flex;gap:6px;margin:6px 0 14px}
.steps i{width:28px;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--red)}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #EEE8E1}
.item:first-child{border-top:none}
.x{width:44px;height:44px;border:none;background:none;color:var(--muted);font-size:22px;flex:none}
.msg{padding:10px 12px;border-radius:12px;background:#FBF3DC;color:#4A3A0C;font-size:14px;margin:10px 0}
#tabs{position:fixed;z-index:2;left:50%;transform:translateX(-50%);bottom:16px;width:calc(100% - 32px);max-width:448px;height:66px;border-radius:33px;display:flex;align-items:center;justify-content:space-around;padding:0 6px}
.theme-a #tabs{background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid rgba(226,178,74,.95);box-shadow:0 14px 30px rgba(48,2,6,.35)}
.theme-b #tabs{background:#fff;border:1px solid #E7E0D8;box-shadow:0 14px 30px rgba(22,20,19,.18)}
#tabs button{flex:1;height:52px;border:none;background:none;color:var(--muted);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
#tabs button.on{color:var(--red);font-weight:700}
#tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px 0;margin-top:10px}
.cal .wd{text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:none;padding:0;color:var(--ink)}
.day b{width:42px;height:42px;border-radius:21px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;border:2px solid transparent}
.day.done b{border-color:var(--gold)}
.day.today b{background:var(--red);color:#fff}
.day.sel b{outline:2px solid var(--ink);outline-offset:2px}
.day i{width:6px;height:6px;border-radius:3px;background:transparent}
.day.new i{background:var(--red)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:12px;padding-top:12px;border-top:1px solid var(--gold)}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.themepick{border:2px solid var(--line);border-radius:18px;background:#fff;padding:0;overflow:hidden;color:var(--ink);font-size:15px;font-weight:700}
.themepick.on{border-color:var(--red)}
.themepick img{display:block;width:100%;height:150px;object-fit:cover;object-position:top}
.themepick div{padding:10px 8px}
</style>
</head>

function tx(s){return LANG==='es'&&ES[s]!==undefined?ES[s]:s;}
function txf(s,a,b){return tx(s).replace('{a}',a).replace('{b}',b);}
function wd(i){return (LANG==='es'?WD_ES:WD)[i];}
function wdl(i){return (LANG==='es'?WDL_ES:WDL)[i];}
function mo(i){return (LANG==='es'?MO_ES:MO)[i];}
function pv(n){return n+' '+tx(n===1?'verse':'verses');}
function dn(y,m,d){return Math.round(Date.UTC(y,m,d)/864e5);}
function isoToDn(s){var p=s.split('-').map(Number);return dn(p[0],p[1]-1,p[2]);}
function dnToDate(n){return new Date(n*864e5);}
function dnToIso(n){return dnToDate(n).toISOString().slice(0,10);}
function todayDn(){var t=new Date();return dn(t.getFullYear(),t.getMonth(),t.getDate());}
function fmt(n,long){
  var d=dnToDate(n),w=d.getUTCDay(),m=d.getUTCMonth(),day=d.getUTCDate();
  if(LANG==='es')return long?WDL_ES[w]+', '+day+' de '+MO_ES[m]:WD_ES[w]+', '+day+' '+MO_ES[m].slice(0,3);
  return (long?WDL:WD)[w]+', '+(long?MO[m]:MO[m].slice(0,3))+' '+day;
}
// How many plan-days into the plan a real date is; null on a rest day or before the start.
function planDay(plan,n){
  var raw=n-isoToDn(plan.start);
  var sh=(plan.shifts||[]).slice().sort(function(a,b){return isoToDn(a.from)-isoToDn(b.from);});
  for(var i=0;i<sh.length;i++){var f=isoToDn(sh[i].from);
    if(n>=f+sh[i].days)raw-=sh[i].days; else if(n>=f)return null;}
  return raw<0?null:raw;
}
// Plan-day on which each verse is first learned.
function buildOffsets(pace,startDn,count){
  var out=[],i;
  if(pace.type==='weekdays'&&pace.days&&pace.days.length){
    for(var d=0;out.length<count&&d<count*7+14;d++){if(pace.days.indexOf(dnToDate(startDn+d).getUTCDay())>=0)out.push(d);}
    return out;
  }
  for(i=0;i<count;i++)out.push(i*(pace.n||1));
  return out;
}
// What a verse needs n plan-days after it was first learned.
function stage(n,realDn){
  if(n<0)return null;
  if(n<4)return {kind:'learn',reps:REPS[n],label:txf(n===0?'New verse · day {a} of 4':'Still learning · day {a} of 4',n+1)};
  if(n<49)return {kind:'daily',reps:1,label:txf('Daily review · day {a} of 45',n-3)};
  if(n<=97){return (n-48)%7===0?{kind:'weekly',reps:1,label:txf('Weekly review · week {a} of 7',(n-48)/7)}:null;}
  return dnToDate(realDn).getUTCDate()===1?{kind:'monthly',reps:1,label:tx('Monthly review')}:null;
}
function tasksFor(plans,done,n){
  var out=[],iso=dnToIso(n);
  plans.forEach(function(plan){
    var pd=planDay(plan,n); if(pd===null)return;
    plan.verses.forEach(function(v,vi){
      var st=stage(pd-plan.offsets[vi],n); if(!st)return;
      var key=plan.id+'|'+vi+'|'+iso;
      out.push({plan:plan,vi:vi,verse:v,kind:st.kind,reps:st.reps,label:st.label,key:key,count:Math.min(done[key]||0,st.reps)});
    });
  });
  var order={learn:0,daily:1,weekly:2,monthly:3};
  out.sort(function(a,b){return order[a.kind]-order[b.kind];});
  return out;
}
// Real date on which a plan-day falls (accounts for rest days).
function dateOfPlanDay(plan,pd){
  var n=isoToDn(plan.start);
  for(var i=0;i<4000;i++,n++){if(planDay(plan,n)===pd)return n;}
  return n;
}
function parsePaste(ref,trans,text){
  var lines=text.split(/\n+/).map(function(s){return s.trim().replace(/^\d+[.)]?\s+/,'');}).filter(Boolean);
  var m=ref.trim().match(/^(.*\d+):(\d+)(?:\s*[-–]\s*(\d+))?$/),tag=trans.trim()?' · '+trans.trim():'';
  return lines.map(function(t,i){
    var r;
    if(m&&(lines.length===1||(m[3]&&(+m[3]-+m[2]+1)===lines.length)))r=m[1]+':'+(+m[2]+i);
    else r=lines.length===1?(ref.trim()||tx('My verse')):(ref.trim()||tx('My passage'))+' ('+tx('part')+' '+(i+1)+')';
    return {ref:r,t:t,tr:tag};
  });
}
function planTitle(vs){
  if(!vs.length)return '';
  if(vs.length===1)return vs[0].ref;
  var a=vs[0].ref,b=vs[vs.length-1].ref,pa=a.slice(0,a.lastIndexOf(':')),pb=b.slice(0,b.lastIndexOf(':'));
  if(a.indexOf(':')>0&&pa===pb)return a+'–'+b.slice(b.lastIndexOf(':')+1);
  return txf('{a} and {b} more',a,vs.length-1);
}

// Flowing gold glitter for the "Flowing gold" background.
var GL={c:null,ctx:null,p:[],raf:0,w:0,h:0};
function glitterOn(){
  var calm=false;try{calm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
  return S.theme!=='B'&&!S.still&&!calm;
}
function glitterSize(){
  var d=Math.min(window.devicePixelRatio||1,2);GL.w=window.innerWidth;GL.h=window.innerHeight;
  GL.c.width=GL.w*d;GL.c.height=GL.h*d;GL.ctx.setTransform(d,0,0,d,0,0);
}
function glitterNew(anywhere){
  return {x:Math.random()*GL.w*1.2-GL.w*0.2,y:anywhere?Math.random()*GL.h:-12,r:0.5+Math.random()*1.7,vx:0.06+Math.random()*0.22,vy:0.10+Math.random()*0.32,ph:Math.random()*6.28,sp:0.6+Math.random()*1.8,sway:Math.random()*6.28};
}
function glitterInit(){
  var c=document.getElementById('glitter');if(!c||!c.getContext)return;
  GL.c=c;GL.ctx=c.getContext('2d');glitterSize();
  window.addEventListener('resize',glitterSize);
  for(var i=0;i<150;i++)GL.p.push(glitterNew(true));
}
function glitterTick(t){
  var ctx=GL.ctx;ctx.clearRect(0,0,GL.w,GL.h);
  if(!glitterOn()){GL.raf=0;return;}
  for(var i=0;i<GL.p.length;i++){
    var p=GL.p[i];
    p.x+=p.vx+Math.sin(t/1500+p.sway)*0.22;p.y+=p.vy;
    if(p.y>GL.h+12||p.x>GL.w+12)GL.p[i]=p=glitterNew(false);
    var a=0.2+0.8*(0.5+0.5*Math.sin(t/1000*p.sp+p.ph));
    ctx.globalAlpha=a*0.2;ctx.fillStyle='#F0C75A';ctx.beginPath();ctx.arc(p.x,p.y,p.r*3.2,0,6.283);ctx.fill();
    ctx.globalAlpha=a;ctx.fillStyle='#FFF1BF';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();
  }
  ctx.globalAlpha=1;
  GL.raf=window.requestAnimationFrame(glitterTick);
}
function glitterSync(){
  if(!GL.ctx)return;
  if(glitterOn()){if(!GL.raf)GL.raf=window.requestAnimationFrame(glitterTick);}
  else if(!GL.raf)GL.ctx.clearRect(0,0,GL.w,GL.h);
}

// Flowing silk for the "Silk ribbon" background: the picture is redrawn in thin
// strips that sway from side to side, so the ribbon ripples like cloth.
var RB={c:null,ctx:null,img:null,ready:false,raf:0,d:1};
function ribbonOn(){
  var calm=false;try{calm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
  return RB.ready&&S.theme==='B'&&!S.still&&!calm;
}
function ribbonSize(){
  RB.d=Math.min(window.devicePixelRatio||1,1.5);
  RB.c.width=Math.round(window.innerWidth*RB.d);RB.c.height=Math.round(window.innerHeight*RB.d);
}
function ribbonInit(){
  var c=document.getElementById('ribbon');if(!c||!c.getContext||typeof Image==='undefined')return;
  RB.c=c;RB.ctx=c.getContext('2d');ribbonSize();
  window.addEventListener('resize',ribbonSize);
  RB.img=new Image();
  RB.img.onload=function(){RB.ready=true;ribbonSync();};
  RB.img.src=IMG_B;
}
function ribbonTick(t){
  if(!ribbonOn()){RB.raf=0;RB.c.style.display='none';return;}
  var ctx=RB.ctx,d=RB.d,W=RB.c.width,H=RB.c.height,iw=RB.img.naturalWidth,ih=RB.img.naturalHeight;
  var sc=Math.max(W/iw,H/ih)*1.08,dw=iw*sc,dx=(W-dw)/2,step=Math.max(2,Math.round(3*d)),s=t/1000;
  var lift=(1+Math.sin(s*0.5))*5*d;
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  for(var y=0;y<H;y+=step){
    var u=y/d,shift=(9*Math.sin(u/130+s*0.8)+5*Math.sin(u/57-s*1.3))*d;
    ctx.drawImage(RB.img,0,(y+lift)/sc,iw,(step+1)/sc,dx+shift,y,dw,step+1);
  }
  RB.raf=window.requestAnimationFrame(ribbonTick);
}
function ribbonSync(){
  if(!RB.ctx)return;
  if(ribbonOn()){RB.c.style.display='block';if(!RB.raf)RB.raf=window.requestAnimationFrame(ribbonTick);}
  else if(!RB.raf)RB.c.style.display='none';
}

    if(W.src==='kjv'){
      body+='<label for="w_book">'+tx('Book')+'</label><select id="w_book">'+names.map(function(b,j){return '<option value="'+j+'"'+(String(j)===String(W.book)?' selected':'')+'>'+b+'</option>';}).join('')+'</select>'+
       '<div class="grid3"><div><label for="w_ch">'+tx('Chapter')+'</label><input id="w_ch" inputmode="numeric" value="'+esc(W.ch)+'"></div><div><label for="w_from">'+tx('From verse')+'</label><input id="w_from" inputmode="numeric" value="'+esc(W.from)+'"></div><div><label for="w_to">'+tx('To verse')+'</label><input id="w_to" inputmode="numeric" placeholder="'+tx('optional')+'" value="'+esc(W.to)+'"></div></div>'+
       '<button class="btn ghost wide" style="margin-top:14px" data-a="wfetch"'+(W.busy?' disabled':'')+'>'+tx(W.busy?'Looking up…':'Add these verses')+'</button>';
    }else{
      body+='<label for="w_ref">'+tx('Reference')+'</label><input id="w_ref" placeholder="'+tx('Colossians 3:1-17')+'" value="'+esc(W.ref)+'"><label for="w_tr">'+tx('Translation (optional)')+'</label><input id="w_tr" placeholder="'+tx('LSB, NASB, ESV…')+'" value="'+esc(W.tr)+'">'+
       '<label for="w_text">'+tx('Verses, one per line')+'</label><textarea id="w_text" placeholder="'+tx('Paste or type each verse on its own line')+'">'+esc(W.text)+'</textarea>'+
       '<button class="btn ghost wide" style="margin-top:14px" data-a="wpaste">'+tx('Add these verses')+'</button>';
    }
    if(W.msg)body+='<div class="msg" role="status">'+esc(W.msg)+'</div>';
    body+='</div>';
    if(W.verses.length){
      body+='<div class="card"><div class="eyebrow">'+tx('Your list')+' · '+pv(W.verses.length)+'</div>'+W.verses.map(function(v,j){return '<div class="item"><div class="grow"><b>'+esc(v.ref)+'</b><div class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(v.t)+'</div></div><button class="x" data-a="wrm" data-i="'+j+'" aria-label="'+esc(txf('Remove {a}',v.ref))+'">×</button></div>';}).join('')+
       '<p class="muted" style="margin-top:8px">'+tx('Add more from anywhere in the Bible, or continue.')+'</p></div>';
    }
    body+='<button class="btn dark wide" data-a="wnext"'+(W.verses.length?'':' disabled')+'>'+tx('Continue')+'</button>';
  }else if(W.step===2){
    body=head+'<h1>'+tx('When would you like to start?')+'</h1></div><div class="card"><label for="w_start">'+tx('Start date')+'</label><input id="w_start" type="date" value="'+esc(W.start)+'"><p class="muted" style="margin-top:10px">'+tx('Your first verse begins on this day.')+'</p></div>'+nav();
  }else if(W.step===3){
    var opts=[[1,'Every day','fastest'],[2,'Every 2 days',''],[3,'Every 3 days',''],[7,'Once a week','gentlest']];
    body=head+'<h1>'+tx('How often would you like a new verse?')+'</h1><p class="muted" style="margin-top:8px">'+esc(planTitle(W.verses))+' · '+pv(W.verses.length)+'</p></div><div class="card">'+
     opts.map(function(o){var on=W.pace.type==='every'&&W.pace.n===o[0];return '<button class="choice'+(on?' on':'')+'" data-a="wpace" data-n="'+o[0]+'" aria-pressed="'+on+'">'+tx(o[1])+'<span>'+(o[2]?tx(o[2]):'')+'</span></button>';}).join('')+
     '<button class="choice'+(W.pace.type==='weekdays'?' on':'')+'" data-a="wpace" data-n="0" aria-pressed="'+(W.pace.type==='weekdays')+'">'+tx('Choose weekdays')+'<span>'+tx('e.g. Mon · Wed · Fri')+'</span></button>'+
     (W.pace.type==='weekdays'?'<div class="chips">'+[0,1,2,3,4,5,6].map(function(j){var on=W.days.indexOf(j)>=0;return '<button class="chip'+(on?' on':'')+'" data-a="wday" data-i="'+j+'" aria-pressed="'+on+'" style="text-transform:capitalize">'+wd(j)+'</button>';}).join('')+'</div>':'')+'</div>'+nav();
  }else if(W.step===4){
    body=head+'<h1>'+tx('When should we remind you?')+'</h1></div><div class="card"><p class="muted">'+tx(isNative()?'Pick a time for each day. Each reminder has buttons to snooze for 1, 2 or 3 hours.':'Pick a time for each day. Reminders with a snooze button arrive with the iPhone version; for now these times show on your calendar.')+'</p>'+reminderRows()+'</div>'+nav();
  }else{
    var off=buildOffsets(wizPace(),isoToDn(W.start),W.verses.length),s0=isoToDn(W.start);
    var lines=W.verses.slice(0,6).map(function(v,j){return '<div class="item"><div class="grow"><b>'+esc(v.ref)+'</b></div><div class="muted">'+txf('starts {a}',fmt(s0+off[j]))+'</div></div>';}).join('');
    body=head+'<h1>'+tx('Your plan')+'</h1></div><div class="card"><h2>'+esc(planTitle(W.verses))+'</h2><p class="muted">'+paceText(wizPace())+' · '+tx('each new verse: 25, 20, 15, then 10 times over four days, then a short daily review.')+'</p>'+lines+
     (W.verses.length>6?'<p class="muted" style="margin-top:8px">'+txf('…and {a} more.',W.verses.length-6)+'</p>':'')+
     '<p style="margin-top:12px"><b>'+tx('Last new verse:')+' '+fmt(s0+off[off.length-1],true)+'</b></p></div><div class="row"><button class="btn plain" data-a="wback">'+tx('Back')+'</button><button class="btn grow" data-a="wdone">'+tx('Start my plan')+'</button></div>';
  }
  return body;
}
function getJson(url){return fetch(url).then(function(r){if(!r.ok)throw new Error('x');return r.json();});}
var ACT={
  lang:function(d){S.lang=d.v;LANG=d.v;save();},
  theme:function(d){S.theme=d.v;save();},
  begin:function(){if(!S.theme)S.theme='A';S.welcomed=true;save();if(!S.plans.length)UI.wiz=newWiz();},
  tab:function(d){UI.tab=d.v;UI.confirm=null;window.scrollTo(0,0);},
  newplan:function(){UI.wiz=newWiz();window.scrollTo(0,0);},
  tap:function(d){S.done[d.k]=Math.min((S.done[d.k]||0)+1,+d.r);save();},
  undo:function(d){S.done[d.k]=Math.max((S.done[d.k]||0)-1,0);save();},
  check:function(d){S.done[d.k]=S.done[d.k]?0:1;save();},
  hide:function(d){UI.hide[d.k]=!UI.hide[d.k];},
  open:function(d){UI.open[d.k]=!UI.open[d.k];},
  shift:function(d){S.plans.forEach(function(p){if(d.id&&p.id!==d.id)return;p.shifts=p.shifts||[];if(!p.shifts.some(function(s){return s.from===d.from;}))p.shifts.push({from:d.from,days:1});});save();},
  askdel:function(d){UI.confirm=d.id;}, nodel:function(){UI.confirm=null;}, askreset:function(){UI.confirm='reset';},
  del:function(d){S.plans=S.plans.filter(function(p){return p.id!==d.id;});UI.confirm=null;save();},
  reset:function(){S.plans=[];S.done={};UI.confirm=null;save();UI.tab='today';},
  still:function(){S.still=!S.still;save();},
  mon:function(d){var c=UI.cal;c.m+=+d.v;if(c.m<0){c.m=11;c.y--;}if(c.m>11){c.m=0;c.y++;}},
  pick:function(d){UI.cal.sel=+d.n;},
  wcancel:function(){UI.wiz=null;},
  wsrc:function(d){UI.wiz.src=d.v;UI.wiz.msg='';},
  wrm:function(d){UI.wiz.verses.splice(+d.i,1);},
  wpaste:function(){var W=UI.wiz;if(!W.text.trim()){W.msg=tx('Type or paste at least one verse first.');return;}W.verses=W.verses.concat(parsePaste(W.ref,W.tr,W.text));W.text='';W.ref='';W.msg=tx('Added.');},
  wfetch:function(){
    var W=UI.wiz,bi=parseInt(W.book,10)||0,ch=parseInt(W.ch,10),a=parseInt(W.from,10),b=parseInt(W.to,10);
    if(!ch||!a){W.msg=tx('Enter a chapter and a starting verse.');return;}
    if(!b||b<a)b=a;
    var es=LANG==='es',code=es?'rv1909':'kjv',tag=es?' · RV1909':' · KJV',name=(es?BOOKS_ES:BOOKS)[bi];
    var shown=name+' '+ch+':'+a+(b>a?'-'+b:'');
    function clean(v){return {ref:name+' '+ch+':'+v.verse,t:String(v.text).replace(/\s+/g,' ').trim(),tr:tag};}
    W.busy=true;W.msg='';
    // First try the chapter address; if that fails, try the older reference address.
    getJson('https://bible-api.com/data/'+code+'/'+BOOK_IDS[bi]+'/'+ch).then(function(j){
      var vs=(j.verses||[]).filter(function(v){return +v.verse>=a&&+v.verse<=b;}).map(clean);
      if(!vs.length)throw new Error('x');return vs;
    }).catch(function(){
      return getJson('https://bible-api.com/'+encodeURIComponent(BOOKS[bi]+' '+ch+':'+a+(b>a?'-'+b:''))+'?translation='+code).then(function(j){
        var vs=(j.verses||[]).map(clean);if(!vs.length)throw new Error('x');return vs;});
    }).then(function(vs){
      if(!UI.wiz)return;
      W.verses=W.verses.concat(vs);W.busy=false;W.msg=txf('Added {a}.',pv(vs.length));render();
    }).catch(function(){if(!UI.wiz)return;W.busy=false;W.src='paste';W.ref=shown;W.tr=es?'RV1909':'KJV';W.msg=tx('The Bible text could not be reached from here. Paste the verses below instead.');render();});
  },
  wnext:function(){var W=UI.wiz;if(W.step===1&&!W.verses.length)return;if(W.step===2&&!/^\d{4}-\d\d-\d\d$/.test(W.start))W.start=dnToIso(todayDn());if(W.step===3&&W.pace.type==='weekdays'&&!W.days.length)W.days=[1,3,5];W.step++;W.msg='';window.scrollTo(0,0);},
  wback:function(){UI.wiz.step--;window.scrollTo(0,0);},
  wpace:function(d){UI.wiz.pace=+d.n?{type:'every',n:+d.n}:{type:'weekdays'};},
  wday:function(d){var a=UI.wiz.days,i=a.indexOf(+d.i);if(i>=0)a.splice(i,1);else a.push(+d.i);},
  wdone:function(){var W=UI.wiz,pace=wizPace();
    S.plans.push({id:'p'+Date.now().toString(36),title:planTitle(W.verses),verses:W.verses,start:W.start,pace:pace,offsets:buildOffsets(pace,isoToDn(W.start),W.verses.length),shifts:[]});
    save();UI.wiz=null;UI.tab='today';window.scrollTo(0,0);}
};
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el||el.disabled)return;
  syncWiz();var f=ACT[el.dataset.a];if(f){f(el.dataset);render();}
});
document.addEventListener('change',function(e){
  var el=e.target;if(el.dataset&&el.dataset.c==='rem'){S.reminders[+el.dataset.i]=el.value||'07:00';save();}
});
load();glitterInit();ribbonInit();render();
</script>

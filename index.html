<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Treasured</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--ink:#161413;--muted:#5E5955;--red:#A4161A;--deep:#7D0F13;--gold:#B8892B;--line:#DDD6CE}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);background:#fff;min-height:100vh;-webkit-text-size-adjust:100%}
#bg{position:fixed;inset:0;overflow:hidden;z-index:0;background:#fff}
#bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.theme-a #bg img{animation:drift 40s ease-in-out infinite alternate}
.theme-b #bg img{object-position:top center;animation:driftb 40s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(-2%,-2%) scale(1.12)}to{transform:translate(2%,2%) scale(1.2)}}
@keyframes driftb{from{transform:scale(1)}to{transform:translate(-1.5%,1%) scale(1.05)}}
@keyframes floaty{from{transform:translateY(0)}to{transform:translateY(-4px)}}
.still #bg img,.still .card{animation:none!important}
@media (prefers-reduced-motion:reduce){#bg img,.card{animation:none!important}}
main{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:28px 16px 120px}
.theme-b main{padding-top:150px}
.card{border-radius:22px;padding:16px 18px;margin-bottom:14px}
.theme-a .card{background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid rgba(226,178,74,.95);box-shadow:0 22px 44px rgba(48,2,6,.36),0 4px 10px rgba(48,2,6,.2),inset 0 1px 0 rgba(255,255,255,.9)}
.theme-b .card{background:rgba(255,255,255,.97);border:1px solid #E7E0D8;box-shadow:0 20px 40px rgba(22,20,19,.16),0 3px 8px rgba(22,20,19,.1)}
.card.float{animation:floaty 8s ease-in-out infinite alternate}
h1{margin:0;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:34px;line-height:1.1}
h2{margin:0 0 8px;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:24px;line-height:1.2}
p{margin:0 0 10px;line-height:1.45}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.eyebrow.red{color:var(--red)}
.muted{color:var(--muted);font-size:14px}
.verse{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:24px;line-height:1.3;margin:8px 0 12px}
.verse.hidden{color:transparent;background:repeating-linear-gradient(0deg,#EFEAE4,#EFEAE4 22px,transparent 22px,transparent 31px);border-radius:8px;user-select:none}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.big{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:44px;line-height:1;color:var(--red)}
.bar{flex:1;height:8px;border-radius:4px;background:#E4DCD3;overflow:hidden}
.bar>i{display:block;height:8px;background:var(--red)}
button{font-family:inherit;cursor:pointer}
.btn{min-height:48px;padding:0 20px;border:none;border-radius:26px;background:var(--red);color:#fff;font-size:16px;font-weight:700}
.btn.wide{width:100%;min-height:54px}
.btn.dark{background:var(--ink)}
.btn.ghost{background:#fff;color:var(--red);border:1.5px solid var(--red)}
.btn.plain{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.btn.small{min-height:44px;padding:0 16px;font-size:14px}
.btn:disabled{opacity:.45}
.circle{width:48px;height:48px;border-radius:24px;border:1.5px solid var(--gold);background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.circle.on{background:var(--red);border-color:var(--red)}
.choice{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:56px;padding:0 18px;margin-bottom:10px;border:1px solid var(--line);border-radius:18px;background:#fff;color:var(--ink);font-size:17px;font-weight:600;text-align:left}
.choice.on{background:var(--red);border-color:var(--red);color:#fff}
.choice span{font-size:14px;font-weight:500;color:var(--muted)}
.choice.on span{color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.chip{min-width:46px;min-height:44px;padding:0 10px;border:1px solid var(--line);border-radius:22px;background:#fff;color:var(--ink);font-size:14px;font-weight:600}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;min-height:48px;padding:10px 12px;border:1px solid #B9B1A8;border-radius:14px;background:#fff;color:var(--ink);font-family:inherit;font-size:16px}
textarea{min-height:140px;line-height:1.4}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.steps{display:flex;gap:6px;margin:6px 0 14px}
.steps i{width:28px;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--red)}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #EEE8E1}
.item:first-child{border-top:none}
.x{width:44px;height:44px;border:none;background:none;color:var(--muted);font-size:22px;flex:none}
.msg{padding:10px 12px;border-radius:12px;background:#FBF3DC;color:#4A3A0C;font-size:14px;margin:10px 0}
#tabs{position:fixed;z-index:2;left:50%;transform:translateX(-50%);bottom:16px;width:calc(100% - 32px);max-width:448px;height:66px;border-radius:33px;display:flex;align-items:center;justify-content:space-around;padding:0 6px}
.theme-a #tabs{background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid rgba(226,178,74,.95);box-shadow:0 14px 30px rgba(48,2,6,.35)}
.theme-b #tabs{background:#fff;border:1px solid #E7E0D8;box-shadow:0 14px 30px rgba(22,20,19,.18)}
#tabs button{flex:1;height:52px;border:none;background:none;color:var(--muted);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
#tabs button.on{color:var(--red);font-weight:700}
#tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px 0;margin-top:10px}
.cal .wd{text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:none;padding:0;color:var(--ink)}
.day b{width:42px;height:42px;border-radius:21px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;border:2px solid transparent}
.day.done b{border-color:var(--gold)}
.day.today b{background:var(--red);color:#fff}
.day.sel b{outline:2px solid var(--ink);outline-offset:2px}
.day i{width:6px;height:6px;border-radius:3px;background:transparent}
.day.new i{background:var(--red)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:12px;padding-top:12px;border-top:1px solid var(--gold)}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.themepick{border:2px solid var(--line);border-radius:18px;background:#fff;padding:0;overflow:hidden;color:var(--ink);font-size:15px;font-weight:700}
.themepick.on{border-color:var(--red)}
.themepick img{display:block;width:100%;height:150px;object-fit:cover;object-position:top}
.themepick div{padding:10px 8px}
</style>
</head>
<body class="theme-a">
<div id="bg"><img id="bgimg" alt=""></div>
<main id="app"></main>
<nav id="tabs" hidden></nav>
<script>
/*LOGIC*/
var WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var WDL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var MO=['January','February','March','April','May','June','July','August','September','October','November','December'];
var REPS=[25,20,15,10];
function dn(y,m,d){return Math.round(Date.UTC(y,m,d)/864e5);}
function isoToDn(s){var p=s.split('-').map(Number);return dn(p[0],p[1]-1,p[2]);}
function dnToDate(n){return new Date(n*864e5);}
function dnToIso(n){return dnToDate(n).toISOString().slice(0,10);}
function todayDn(){var t=new Date();return dn(t.getFullYear(),t.getMonth(),t.getDate());}
function fmt(n,long){var d=dnToDate(n);return (long?WDL:WD)[d.getUTCDay()]+', '+(long?MO[d.getUTCMonth()]:MO[d.getUTCMonth()].slice(0,3))+' '+d.getUTCDate();}
// How many plan-days into the plan a real date is; null on a rest day or before the start.
function planDay(plan,n){
  var raw=n-isoToDn(plan.start);
  var sh=(plan.shifts||[]).slice().sort(function(a,b){return isoToDn(a.from)-isoToDn(b.from);});
  for(var i=0;i<sh.length;i++){var f=isoToDn(sh[i].from);
    if(n>=f+sh[i].days)raw-=sh[i].days; else if(n>=f)return null;}
  return raw<0?null:raw;
}
// Plan-day on which each verse is first learned.
function buildOffsets(pace,startDn,count){
  var out=[],i;
  if(pace.type==='weekdays'&&pace.days&&pace.days.length){
    for(var d=0;out.length<count&&d<count*7+14;d++){if(pace.days.indexOf(dnToDate(startDn+d).getUTCDay())>=0)out.push(d);}
    return out;
  }
  for(i=0;i<count;i++)out.push(i*(pace.n||1));
  return out;
}
// What a verse needs n plan-days after it was first learned.
function stage(n,realDn){
  if(n<0)return null;
  if(n<4)return {kind:'learn',reps:REPS[n],label:(n===0?'New verse':'Still learning')+' · day '+(n+1)+' of 4'};
  if(n<49)return {kind:'daily',reps:1,label:'Daily review · day '+(n-3)+' of 45'};
  if(n<=97){return (n-48)%7===0?{kind:'weekly',reps:1,label:'Weekly review · week '+((n-48)/7)+' of 7'}:null;}
  return dnToDate(realDn).getUTCDate()===1?{kind:'monthly',reps:1,label:'Monthly review'}:null;
}
function tasksFor(plans,done,n){
  var out=[],iso=dnToIso(n);
  plans.forEach(function(plan){
    var pd=planDay(plan,n); if(pd===null)return;
    plan.verses.forEach(function(v,vi){
      var st=stage(pd-plan.offsets[vi],n); if(!st)return;
      var key=plan.id+'|'+vi+'|'+iso;
      out.push({plan:plan,vi:vi,verse:v,kind:st.kind,reps:st.reps,label:st.label,key:key,count:Math.min(done[key]||0,st.reps)});
    });
  });
  var order={learn:0,daily:1,weekly:2,monthly:3};
  out.sort(function(a,b){return order[a.kind]-order[b.kind];});
  return out;
}
// Real date on which a plan-day falls (accounts for rest days).
function dateOfPlanDay(plan,pd){
  var n=isoToDn(plan.start);
  for(var i=0;i<4000;i++,n++){if(planDay(plan,n)===pd)return n;}
  return n;
}
function parsePaste(ref,trans,text){
  var lines=text.split(/\n+/).map(function(s){return s.trim().replace(/^\d+[.)]?\s+/,'');}).filter(Boolean);
  var m=ref.trim().match(/^(.*\d+):(\d+)(?:\s*[-–]\s*(\d+))?$/),tag=trans.trim()?' · '+trans.trim():'';
  return lines.map(function(t,i){
    var r;
    if(m&&(lines.length===1||(m[3]&&(+m[3]-+m[2]+1)===lines.length)))r=m[1]+':'+(+m[2]+i);
    else r=lines.length===1?(ref.trim()||'My verse'):(ref.trim()||'My passage')+' (part '+(i+1)+')';
    return {ref:r,t:t,tr:tag};
  });
}
function planTitle(vs){
  if(!vs.length)return '';
  if(vs.length===1)return vs[0].ref;
  var a=vs[0].ref,b=vs[vs.length-1].ref,pa=a.slice(0,a.lastIndexOf(':')),pb=b.slice(0,b.lastIndexOf(':'));
  if(a.indexOf(':')>0&&pa===pb)return a+'–'+b.slice(b.lastIndexOf(':')+1);
  return a+' and '+(vs.length-1)+' more';
}
/*END*/
var BOOKS='Genesis,Exodus,Leviticus,Numbers,Deuteronomy,Joshua,Judges,Ruth,1 Samuel,2 Samuel,1 Kings,2 Kings,1 Chronicles,2 Chronicles,Ezra,Nehemiah,Esther,Job,Psalms,Proverbs,Ecclesiastes,Song of Solomon,Isaiah,Jeremiah,Lamentations,Ezekiel,Daniel,Hosea,Joel,Amos,Obadiah,Jonah,Micah,Nahum,Habakkuk,Zephaniah,Haggai,Zechariah,Malachi,Matthew,Mark,Luke,John,Acts,Romans,1 Corinthians,2 Corinthians,Galatians,Ephesians,Philippians,Colossians,1 Thessalonians,2 Thessalonians,1 Timothy,2 Timothy,Titus,Philemon,Hebrews,James,1 Peter,2 Peter,1 John,2 John,3 John,Jude,Revelation'.split(',');
var IMG_A='assets/flow.jpg',IMG_B='assets/ribbon.jpg';
var KEY='treasured.v1';
var S={theme:null,still:false,plans:[],reminders:['07:00','07:00','07:00','07:00','07:00','07:00','07:00'],done:{}};
var UI={tab:'today',hide:{},open:{},wiz:null,cal:null,confirm:null};
function $(s){return document.querySelector(s);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);for(var k in o)S[k]=o[k];}}catch(e){}}
function isNative(){return !!(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.treasured);}
function nativeSync(){if(isNative()){try{window.webkit.messageHandlers.treasured.postMessage({reminders:S.reminders,active:S.plans.length>0});}catch(e){}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}nativeSync();}
var CHECK='<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>';

function applyTheme(){
  document.body.className='theme-'+(S.theme==='B'?'b':'a')+(S.still?' still':'');
  var want=S.theme==='B'?IMG_B:IMG_A,im=$('#bgimg');if(im.getAttribute('src')!==want)im.setAttribute('src',want);
}
function themePicker(){
  return '<div class="themes">'+
   '<button class="themepick'+(S.theme!=='B'?' on':'')+'" data-a="theme" data-v="A" aria-pressed="'+(S.theme!=='B')+'"><img src="'+IMG_A+'" alt=""><div>Flowing gold</div></button>'+
   '<button class="themepick'+(S.theme==='B'?' on':'')+'" data-a="theme" data-v="B" aria-pressed="'+(S.theme==='B')+'"><img src="'+IMG_B+'" alt=""><div>Silk ribbon</div></button></div>';
}
function render(){
  applyTheme();
  var app=$('#app'),tabs=$('#tabs'),html;
  if(UI.wiz){tabs.hidden=true;html=viewWizard();}
  else if(!S.welcomed){tabs.hidden=true;html=viewWelcome();}
  else{
    tabs.hidden=false;
    html=UI.tab==='calendar'?viewCalendar():UI.tab==='passages'?viewPassages():UI.tab==='settings'?viewSettings():viewToday();
    var T=[['today','Today','<circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path>'],['calendar','Calendar','<rect x="4" y="5" width="16" height="15" rx="3"></rect><path d="M4 10h16M9 3v4M15 3v4"></path>'],['passages','Passages','<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"></path><path d="M9 9h6M9 13h6"></path>'],['settings','Settings','<path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path><circle cx="16" cy="7" r="2"></circle><circle cx="8" cy="17" r="2"></circle>']];
    tabs.innerHTML=T.map(function(t){return '<button data-a="tab" data-v="'+t[0]+'" class="'+(UI.tab===t[0]?'on':'')+'"'+(UI.tab===t[0]?' aria-current="page"':'')+'><svg aria-hidden="true" viewBox="0 0 24 24">'+t[2]+'</svg>'+t[1]+'</button>';}).join('');
  }
  app.innerHTML=html;
}
function viewWelcome(){
  return '<div class="card"><div class="eyebrow red">Welcome</div><h1>Treasured</h1><p style="margin-top:10px">Hide God\'s Word in your heart, a few minutes a day. Pick a passage, choose your pace, and your calendar is built for you.</p></div>'+
   '<div class="card"><h2>Choose your look</h2><p class="muted">You can change this any time in Settings.</p>'+themePicker()+
   '<button class="btn wide" data-a="begin">Continue</button></div>';
}
function taskCard(t){
  var id=t.key,done=t.count>=t.reps;
  if(t.kind==='learn'){
    var hidden=UI.hide[id];
    return '<div class="card float"><div class="row between"><div class="eyebrow red">'+esc(t.label)+'</div><div class="muted" style="font-weight:600">'+esc(t.verse.ref+(t.verse.tr||''))+'</div></div>'+
     '<p class="verse'+(hidden?' hidden':'')+'"'+(hidden?' aria-hidden="true"':'')+'>'+esc(t.verse.t)+'</p>'+
     '<div class="row" style="margin-bottom:12px"><div><span class="big">'+t.count+'</span> <span class="muted" style="font-weight:600">of '+t.reps+'</span></div><div class="bar"><i style="width:'+Math.round(t.count/t.reps*100)+'%"></i></div></div>'+
     '<div class="row"><button class="btn grow" data-a="tap" data-k="'+esc(id)+'" data-r="'+t.reps+'"'+(done?' disabled':'')+'>'+(done?'Done for today':'I said it — tap')+'</button>'+
     '<button class="btn plain small" data-a="hide" data-k="'+esc(id)+'">'+(hidden?'Show':'Hide')+' words</button></div>'+
     (t.count>0?'<button class="btn small" style="background:none;color:var(--muted);padding:0;margin-top:6px" data-a="undo" data-k="'+esc(id)+'">Undo last tap</button>':'')+'</div>';
  }
  var open=UI.open[id];
  return '<div class="card"><div class="row"><button class="grow" style="border:none;background:none;text-align:left;padding:0;color:inherit" data-a="open" data-k="'+esc(id)+'" aria-expanded="'+!!open+'"><div class="eyebrow">'+esc(t.label)+'</div><div style="font-family:\'Cormorant Garamond\',serif;font-weight:600;font-size:22px">'+esc(t.verse.ref)+'</div><div class="muted">Say it once · tap to '+(open?'hide':'check')+' the words</div></button>'+
   '<button class="circle'+(done?' on':'')+'" data-a="check" data-k="'+esc(id)+'" aria-label="Mark '+esc(t.verse.ref)+' as said" aria-pressed="'+done+'"><span style="display:flex;stroke:'+(done?'#fff':'#8A6516')+'">'+CHECK+'</span></button></div>'+
   (open?'<p class="verse" style="margin-bottom:0">'+esc(t.verse.t)+'</p>':'')+'</div>';
}
function viewToday(){
  var n=todayDn(),ts=tasksFor(S.plans,S.done,n),h='';
  var left=ts.filter(function(t){return t.count<t.reps;}).length;
  h+='<div class="card"><div class="eyebrow">'+fmt(n,true)+'</div><h1>Today\'s practice</h1>'+
     (S.plans.length?'<p class="muted" style="margin:6px 0 0">'+(ts.length?(left?left+' of '+ts.length+' left today':'All done for today. Well done.'):'Nothing scheduled today. Rest well.')+'</p>':'')+'</div>';
  if(!S.plans.length)return h+'<div class="card"><h2>Start your first passage</h2><p>Choose a verse or passage and we will build your schedule.</p><button class="btn wide" data-a="newplan">Choose a passage</button></div>';
  var missed=tasksFor(S.plans,S.done,n-1).filter(function(t){return t.kind==='learn'&&t.count<t.reps;});
  if(missed.length)h+='<div class="card"><div class="eyebrow red">Missed yesterday?</div><p style="margin-top:6px">No guilt. Slide your whole schedule forward one day and pick up where you left off.</p><button class="btn ghost small" data-a="shift" data-from="'+dnToIso(n-1)+'">Move my schedule forward</button></div>';
  return h+ts.map(taskCard).join('');
}
function viewCalendar(){
  var t=todayDn();
  if(!UI.cal){var d=dnToDate(t);UI.cal={y:d.getUTCFullYear(),m:d.getUTCMonth(),sel:t};}
  var c=UI.cal,first=dn(c.y,c.m,1),lead=dnToDate(first).getUTCDay(),len=dn(c.y,c.m+1,1)-first,cells='';
  for(var i=0;i<7;i++)cells+='<div class="wd">'+WD[i]+'</div>';
  for(i=0;i<lead;i++)cells+='<div></div>';
  for(i=0;i<len;i++){
    var n=first+i,ts=tasksFor(S.plans,S.done,n),cls='day';
    if(ts.some(function(x){return x.kind==='learn'&&x.reps===25;}))cls+=' new';
    if(ts.length&&ts.every(function(x){return x.count>=x.reps;}))cls+=' done';
    if(n===t)cls+=' today'; if(n===c.sel)cls+=' sel';
    cells+='<button class="'+cls+'" data-a="pick" data-n="'+n+'" aria-label="'+fmt(n,true)+'"><b>'+(i+1)+'</b><i></i></button>';
  }
  var sel=tasksFor(S.plans,S.done,c.sel),w=dnToDate(c.sel).getUTCDay();
  var list=sel.length?sel.map(function(x){return '<div class="item"><div class="grow"><b>'+esc(x.verse.ref)+'</b><div class="muted">'+esc(x.label)+'</div></div><div class="muted" style="font-weight:700">× '+x.reps+'</div></div>';}).join(''):'<p class="muted">Nothing scheduled.</p>';
  return '<div class="card"><div class="row between"><button class="btn plain small" data-a="mon" data-v="-1" aria-label="Previous month">‹</button><h1 style="font-size:28px">'+MO[c.m]+' '+c.y+'</h1><button class="btn plain small" data-a="mon" data-v="1" aria-label="Next month">›</button></div>'+
   '<div class="cal">'+cells+'</div><div class="legend"><span>● New verse</span><span>◯ gold ring: completed</span><span>Filled: today</span></div></div>'+
   '<div class="card"><div class="eyebrow">'+fmt(c.sel,true)+'</div><div style="margin-top:6px">'+list+'</div><p class="muted" style="margin:10px 0 0">Reminder time on '+WDL[w]+'s: '+esc(S.reminders[w])+'</p></div>';
}
function paceText(p){return p.type==='weekdays'?'On '+p.days.map(function(d){return WD[d];}).join(', '):p.n===1?'Every day':p.n===7?'Once a week':'Every '+p.n+' days';}
function viewPassages(){
  var t=todayDn();
  var h='<div class="card"><h1>Passages</h1><p class="muted" style="margin:6px 0 12px">Everything you are memorizing.</p><button class="btn wide" data-a="newplan">Add a verse or passage</button></div>';
  S.plans.forEach(function(p){
    var pd=planDay(p,t),started=p.offsets.filter(function(o){return pd!==null&&o<=pd;}).length;
    if(pd===null&&t>isoToDn(p.start))started=p.offsets.filter(function(o){return dateOfPlanDay(p,o)<=t;}).length;
    h+='<div class="card"><h2>'+esc(p.title)+'</h2><p class="muted">'+started+' of '+p.verses.length+' verses started · '+paceText(p.pace)+' · began '+fmt(isoToDn(p.start))+'</p>'+
     '<div class="row" style="flex-wrap:wrap"><button class="btn ghost small" data-a="shift" data-id="'+p.id+'" data-from="'+dnToIso(t)+'">Take a rest day today</button>'+
     (UI.confirm===p.id?'<span class="muted">Delete this passage and its progress?</span><button class="btn small" data-a="del" data-id="'+p.id+'">Yes, delete</button><button class="btn plain small" data-a="nodel">Keep</button>':'<button class="btn plain small" data-a="askdel" data-id="'+p.id+'">Delete</button>')+'</div></div>';
  });
  return h;
}
function viewSettings(){
  var rows='';
  for(var i=0;i<7;i++)rows+='<div class="row between" style="margin-bottom:8px"><label for="r'+i+'" style="margin:0;font-size:15px;color:var(--ink)">'+WDL[i]+'</label><input id="r'+i+'" type="time" data-c="rem" data-i="'+i+'" value="'+esc(S.reminders[i])+'" style="width:140px"></div>';
  return '<div class="card"><h1>Settings</h1></div>'+
   '<div class="card"><h2>Background</h2>'+themePicker()+'<button class="choice'+(S.still?' on':'')+'" data-a="still" aria-pressed="'+!!S.still+'">Still mode<span>'+(S.still?'motion off':'motion on')+'</span></button></div>'+
   '<div class="card"><h2>Reminder times</h2><p class="muted">'+(isNative()?'You will get a reminder at these times, with buttons to snooze for 1, 2 or 3 hours.':'Saved for each day of the week. Reminders with snooze arrive with the iPhone version; this web version cannot send them.')+'</p>'+rows+'</div>'+
   '<div class="card"><h2>About</h2><p class="muted">Scripture from the King James Version, which is in the public domain, looked up through bible-api.com. You can also paste verses from your own Bible for personal use. Your passages and progress are stored only on this device.</p>'+
   (UI.confirm==='reset'?'<p>Erase all passages and progress on this device?</p><div class="row"><button class="btn small" data-a="reset">Yes, erase</button><button class="btn plain small" data-a="nodel">Keep</button></div>':'<button class="btn plain small" data-a="askreset">Erase everything</button>')+'</div>';
}
function newWiz(){return {step:1,src:'kjv',book:'Colossians',ch:'3',from:'1',to:'',ref:'',tr:'',text:'',verses:[],start:dnToIso(todayDn()),pace:{type:'every',n:2},days:[1,3,5],msg:'',busy:false};}
function syncWiz(){
  var W=UI.wiz;if(!W)return;
  ['book','ch','from','to','ref','tr','text','start'].forEach(function(k){var el=document.getElementById('w_'+k);if(el)W[k]=el.value;});
}
function wizPace(){var W=UI.wiz;return W.pace.type==='weekdays'?{type:'weekdays',days:W.days.slice().sort()}:{type:'every',n:W.pace.n};}
function viewWizard(){
  var W=UI.wiz,dots='',body='',i;
  for(i=1;i<=5;i++)dots+='<i class="'+(i<=W.step?'on':'')+'"></i>';
  var head='<div class="card"><div class="row between"><div class="eyebrow">Step '+W.step+' of 5</div><button class="btn plain small" data-a="wcancel">Cancel</button></div><div class="steps">'+dots+'</div>';
  if(W.step===1){
    body=head+'<h1>What would you like to memorize?</h1></div><div class="card"><div class="chips"><button class="chip'+(W.src==='kjv'?' on':'')+'" data-a="wsrc" data-v="kjv" aria-pressed="'+(W.src==='kjv')+'">King James Version</button><button class="chip'+(W.src==='paste'?' on':'')+'" data-a="wsrc" data-v="paste" aria-pressed="'+(W.src==='paste')+'">Paste my own</button></div>';
    if(W.src==='kjv'){
      body+='<label for="w_book">Book</label><select id="w_book">'+BOOKS.map(function(b){return '<option'+(b===W.book?' selected':'')+'>'+b+'</option>';}).join('')+'</select>'+
       '<div class="grid3"><div><label for="w_ch">Chapter</label><input id="w_ch" inputmode="numeric" value="'+esc(W.ch)+'"></div><div><label for="w_from">From verse</label><input id="w_from" inputmode="numeric" value="'+esc(W.from)+'"></div><div><label for="w_to">To verse</label><input id="w_to" inputmode="numeric" placeholder="optional" value="'+esc(W.to)+'"></div></div>'+
       '<button class="btn ghost wide" style="margin-top:14px" data-a="wfetch"'+(W.busy?' disabled':'')+'>'+(W.busy?'Looking up…':'Add these verses')+'</button>';
    }else{
      body+='<label for="w_ref">Reference</label><input id="w_ref" placeholder="Colossians 3:1-17" value="'+esc(W.ref)+'"><label for="w_tr">Translation (optional)</label><input id="w_tr" placeholder="LSB, NASB, ESV…" value="'+esc(W.tr)+'">'+
       '<label for="w_text">Verses, one per line</label><textarea id="w_text" placeholder="Paste or type each verse on its own line">'+esc(W.text)+'</textarea>'+
       '<button class="btn ghost wide" style="margin-top:14px" data-a="wpaste">Add these verses</button>';
    }
    if(W.msg)body+='<div class="msg" role="status">'+esc(W.msg)+'</div>';
    body+='</div>';
    if(W.verses.length){
      body+='<div class="card"><div class="eyebrow">Your list · '+W.verses.length+' verse'+(W.verses.length>1?'s':'')+'</div>'+W.verses.map(function(v,j){return '<div class="item"><div class="grow"><b>'+esc(v.ref)+'</b><div class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(v.t)+'</div></div><button class="x" data-a="wrm" data-i="'+j+'" aria-label="Remove '+esc(v.ref)+'">×</button></div>';}).join('')+
       '<p class="muted" style="margin-top:8px">Add more from anywhere in the Bible, or continue.</p></div>';
    }
    body+='<button class="btn dark wide" data-a="wnext"'+(W.verses.length?'':' disabled')+'>Continue</button>';
  }else if(W.step===2){
    body=head+'<h1>When would you like to start?</h1></div><div class="card"><label for="w_start">Start date</label><input id="w_start" type="date" value="'+esc(W.start)+'"><p class="muted" style="margin-top:10px">Your first verse begins on this day.</p></div>'+nav();
  }else if(W.step===3){
    var opts=[[1,'Every day','fastest'],[2,'Every 2 days',''],[3,'Every 3 days',''],[7,'Once a week','gentlest']];
    body=head+'<h1>How often would you like a new verse?</h1><p class="muted" style="margin-top:8px">'+esc(planTitle(W.verses))+' · '+W.verses.length+' verse'+(W.verses.length>1?'s':'')+'</p></div><div class="card">'+
     opts.map(function(o){var on=W.pace.type==='every'&&W.pace.n===o[0];return '<button class="choice'+(on?' on':'')+'" data-a="wpace" data-n="'+o[0]+'" aria-pressed="'+on+'">'+o[1]+'<span>'+o[2]+'</span></button>';}).join('')+
     '<button class="choice'+(W.pace.type==='weekdays'?' on':'')+'" data-a="wpace" data-n="0" aria-pressed="'+(W.pace.type==='weekdays')+'">Choose weekdays<span>e.g. Mon · Wed · Fri</span></button>'+
     (W.pace.type==='weekdays'?'<div class="chips">'+WD.map(function(d,j){var on=W.days.indexOf(j)>=0;return '<button class="chip'+(on?' on':'')+'" data-a="wday" data-i="'+j+'" aria-pressed="'+on+'">'+d+'</button>';}).join('')+'</div>':'')+'</div>'+nav();
  }else if(W.step===4){
    var rows='';
    for(i=0;i<7;i++)rows+='<div class="row between" style="margin-bottom:8px"><label for="r'+i+'" style="margin:0;font-size:15px;color:var(--ink)">'+WDL[i]+'</label><input id="r'+i+'" type="time" data-c="rem" data-i="'+i+'" value="'+esc(S.reminders[i])+'" style="width:140px"></div>';
    body=head+'<h1>When should we remind you?</h1></div><div class="card"><p class="muted">'+(isNative()?'Pick a time for each day. Each reminder has buttons to snooze for 1, 2 or 3 hours.':'Pick a time for each day. Reminders with a snooze button arrive with the iPhone version; for now these times show on your calendar.')+'</p>'+rows+'</div>'+nav();
  }else{
    var tmp={start:W.start,shifts:[]},off=buildOffsets(wizPace(),isoToDn(W.start),W.verses.length),s0=isoToDn(W.start);
    var lines=W.verses.slice(0,6).map(function(v,j){return '<div class="item"><div class="grow"><b>'+esc(v.ref)+'</b></div><div class="muted">starts '+fmt(s0+off[j])+'</div></div>';}).join('');
    body=head+'<h1>Your plan</h1></div><div class="card"><h2>'+esc(planTitle(W.verses))+'</h2><p class="muted">'+paceText(wizPace())+' · each new verse: 25, 20, 15, then 10 times over four days, then a short daily review.</p>'+lines+
     (W.verses.length>6?'<p class="muted" style="margin-top:8px">…and '+(W.verses.length-6)+' more.</p>':'')+
     '<p style="margin-top:12px"><b>Last new verse: '+fmt(s0+off[off.length-1],true)+'</b></p></div><div class="row"><button class="btn plain" data-a="wback">Back</button><button class="btn grow" data-a="wdone">Start my plan</button></div>';
  }
  return body;
  function nav(){return '<div class="row"><button class="btn plain" data-a="wback">Back</button><button class="btn dark grow" data-a="wnext">Continue</button></div>';}
}
var ACT={
  theme:function(d){S.theme=d.v;save();},
  begin:function(){if(!S.theme)S.theme='A';S.welcomed=true;save();if(!S.plans.length)UI.wiz=newWiz();},
  tab:function(d){UI.tab=d.v;UI.confirm=null;window.scrollTo(0,0);},
  newplan:function(){UI.wiz=newWiz();window.scrollTo(0,0);},
  tap:function(d){S.done[d.k]=Math.min((S.done[d.k]||0)+1,+d.r);save();},
  undo:function(d){S.done[d.k]=Math.max((S.done[d.k]||0)-1,0);save();},
  check:function(d){S.done[d.k]=S.done[d.k]?0:1;save();},
  hide:function(d){UI.hide[d.k]=!UI.hide[d.k];},
  open:function(d){UI.open[d.k]=!UI.open[d.k];},
  shift:function(d){S.plans.forEach(function(p){if(d.id&&p.id!==d.id)return;p.shifts=p.shifts||[];if(!p.shifts.some(function(s){return s.from===d.from;}))p.shifts.push({from:d.from,days:1});});save();},
  askdel:function(d){UI.confirm=d.id;}, nodel:function(){UI.confirm=null;}, askreset:function(){UI.confirm='reset';},
  del:function(d){S.plans=S.plans.filter(function(p){return p.id!==d.id;});UI.confirm=null;save();},
  reset:function(){S.plans=[];S.done={};UI.confirm=null;save();UI.tab='today';},
  still:function(){S.still=!S.still;save();},
  mon:function(d){var c=UI.cal;c.m+=+d.v;if(c.m<0){c.m=11;c.y--;}if(c.m>11){c.m=0;c.y++;}},
  pick:function(d){UI.cal.sel=+d.n;},
  wcancel:function(){UI.wiz=null;},
  wsrc:function(d){UI.wiz.src=d.v;UI.wiz.msg='';},
  wrm:function(d){UI.wiz.verses.splice(+d.i,1);},
  wpaste:function(){var W=UI.wiz;if(!W.text.trim()){W.msg='Type or paste at least one verse first.';return;}W.verses=W.verses.concat(parsePaste(W.ref,W.tr,W.text));W.text='';W.ref='';W.msg='Added.';},
  wfetch:function(){
    var W=UI.wiz,ch=parseInt(W.ch,10),a=parseInt(W.from,10),b=parseInt(W.to,10);
    if(!ch||!a){W.msg='Enter a chapter and a starting verse.';return;}
    if(!b||b<a)b=a;
    var ref=W.book+' '+ch+':'+a+(b>a?'-'+b:'');
    W.busy=true;W.msg='';
    fetch('https://bible-api.com/'+encodeURIComponent(ref)+'?translation=kjv').then(function(r){if(!r.ok)throw new Error('x');return r.json();}).then(function(j){
      if(!UI.wiz)return;
      var vs=(j.verses||[]).map(function(v){return {ref:W.book+' '+v.chapter+':'+v.verse,t:String(v.text).replace(/\s+/g,' ').trim(),tr:' · KJV'};});
      if(!vs.length)throw new Error('x');
      W.verses=W.verses.concat(vs);W.busy=false;W.msg='Added '+vs.length+' verse'+(vs.length>1?'s':'')+'.';render();
    }).catch(function(){if(!UI.wiz)return;W.busy=false;W.src='paste';W.ref=ref;W.tr='KJV';W.msg='The King James text could not be reached from here. Paste the verses below instead.';render();});
  },
  wnext:function(){var W=UI.wiz;if(W.step===1&&!W.verses.length)return;if(W.step===2&&!/^\d{4}-\d\d-\d\d$/.test(W.start))W.start=dnToIso(todayDn());if(W.step===3&&W.pace.type==='weekdays'&&!W.days.length)W.days=[1,3,5];W.step++;W.msg='';window.scrollTo(0,0);},
  wback:function(){UI.wiz.step--;window.scrollTo(0,0);},
  wpace:function(d){UI.wiz.pace=+d.n?{type:'every',n:+d.n}:{type:'weekdays'};},
  wday:function(d){var a=UI.wiz.days,i=a.indexOf(+d.i);if(i>=0)a.splice(i,1);else a.push(+d.i);},
  wdone:function(){var W=UI.wiz,pace=wizPace();
    S.plans.push({id:'p'+Date.now().toString(36),title:planTitle(W.verses),verses:W.verses,start:W.start,pace:pace,offsets:buildOffsets(pace,isoToDn(W.start),W.verses.length),shifts:[]});
    save();UI.wiz=null;UI.tab='today';window.scrollTo(0,0);}
};
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el||el.disabled)return;
  syncWiz();var f=ACT[el.dataset.a];if(f){f(el.dataset);render();}
});
document.addEventListener('change',function(e){
  var el=e.target;if(el.dataset&&el.dataset.c==='rem'){S.reminders[+el.dataset.i]=el.value||'07:00';save();}
});
load();render();
</script>
</body>
</html>
